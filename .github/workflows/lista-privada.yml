name: Aviso a la lista privada

# Cada hora le pregunta al sitio si toca mandar el aviso del próximo drop a la
# lista privada (24 h antes de la fecha cargada en Configuración → Próximo
# drop). El endpoint decide y manda UNA sola vez por drop: llamarlo de más no
# duplica nada. Usa el mismo secret CRON_SECRET que el resumen diario.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

jobs:
  aviso-lista:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar si toca mandar el aviso
        run: |
          curl -sf -X GET "https://dahila.uy/api/cron/lista-privada" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
